# Cấu hình không bí mật của app (được commit).
[server]
# Giới hạn tải lên tính bằng MB, khớp với config.ANH_MAX_BYTES
maxUploadSize = 5

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[global]
# Ô trọng số và hạn chót có giá trị mặc định, đồng thời được điền lại khi chọn mẫu. Đây là chủ ý.
disableWidgetStateDuplicationWarning = true
